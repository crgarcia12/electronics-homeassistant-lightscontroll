script:
  lightcontrol_check_updates:
    alias: Check all LightControl controllers for updates
    description: Ask every online controller to refresh its GitHub firmware release metadata.
    mode: single
    icon: mdi:refresh
    sequence:
      - action: mqtt.publish
        data:
          topic: home/lightcontrol/all/firmware/check
          payload: CHECK

  lightcontrol_update_all:
    alias: Update all LightControl controllers
    description: Publish UPDATE to every controller firmware topic.
    mode: single
    icon: mdi:update
    sequence:
      - action: mqtt.publish
        data:
          topic: home/lightcontrol/all/firmware/update
          payload: UPDATE
